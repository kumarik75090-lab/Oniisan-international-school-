<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Oniisan International School</title>
<style>
:root{--pri:#4f46e5;--bg:#f1f3fb;--card:#fff;--txt:#1f2937;--mut:#6b7280;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:90px;font-size:15px}
button,input,select,textarea{font:inherit}
a{color:var(--pri);text-decoration:none}
#top{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 55%,#000));color:#fff;padding:18px 16px 26px;display:flex;gap:12px;align-items:center;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.logo{width:54px;height:54px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.logo.big{width:80px;height:80px;font-size:42px;border:2px solid var(--line)}
.ti{flex:1;min-width:0}
.ti h1{font-size:19px;line-height:1.2}
.ti p{font-size:12px;opacity:.85;margin-top:2px}
.dt{font-size:11px;text-align:right;opacity:.95;line-height:1.4}
main{max-width:920px;margin:-12px auto 0;padding:0 14px}
.sec{font-size:18px;margin:18px 2px 10px}
.sec small{font-weight:400;color:var(--mut);font-size:12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(30,40,90,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid .card{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--txt);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:80px;resize:vertical}
input[type=color]{height:44px;padding:3px}
input[type=checkbox]{width:auto}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn.sm{padding:8px 12px;font-size:13px;margin-top:0}
.btn.out{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.full{width:100%}
.btn.red{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.st{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 2px 10px rgba(30,40,90,.07)}
.st b{display:block;font-size:24px;color:var(--pri)}
.st span{font-size:12px;color:var(--mut)}
.st.ok b{color:var(--ok)}.st.bad b{color:var(--bad)}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:#f5f6fc;border-radius:12px;text-align:center;padding:10px 4px;font-size:12px;color:var(--mut)}
.sc b{display:block;font-size:22px;color:var(--txt)}
.sc.ok b{color:var(--ok)}.sc.bad b{color:var(--bad)}
.banner{border-radius:16px;padding:14px;margin-bottom:12px;font-weight:700;display:flex;gap:10px;align-items:center}
.banner.open{background:#dcfce7;color:#166534}
.banner.hol{background:#fee2e2;color:#991b1b}
.alert{background:#fee2e2;color:#991b1b;padding:10px;border-radius:12px;margin:10px 0;font-weight:600}
.tick{background:#fff;border-radius:12px;overflow:hidden;white-space:nowrap;padding:10px 0;margin-bottom:12px;box-shadow:0 2px 10px rgba(30,40,90,.07);font-weight:600}
.tick span{display:inline-block;padding-left:100%;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.av{border-radius:50%;object-fit:cover;flex-shrink:0;background:#e0e7ff}
.av.ph{display:flex;align-items:center;justify-content:center;color:var(--pri);font-weight:800}
.srow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}
.sn b{display:block}.sn small{color:var(--mut);font-size:12px}
.gt{font-weight:800;margin-bottom:4px}
.gt.bad{color:var(--bad)}.gt.ok{color:var(--ok)}.gt.mut{color:var(--mut)}
.badge{display:inline-block;background:#e0e7ff;color:var(--pri);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge.g{background:#fef3c7;color:#92400e}
.tc{display:flex;gap:12px;align-items:flex-start}
.tc h4{font-size:16px;margin-bottom:4px}
.tc p{font-size:13px;color:var(--mut);margin-top:3px}
.tp{display:flex;gap:12px;align-items:center}
.tp .rk{font-size:26px}
.dh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.dh small{margin-left:auto;color:var(--mut)}
.dc p{margin-top:6px;font-size:14px;line-height:1.5}
.cc{cursor:pointer}
.cc h3{font-size:18px;color:var(--pri)}
.cc .n{font-size:26px;font-weight:800;margin:4px 0}
.cc small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:11px;text-transform:uppercase}
td:first-child,th:first-child{text-align:left;font-weight:700}
tr.link{cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:18px}
.hrow{display:flex;gap:12px;align-items:center}
.hrow .d{background:#e0e7ff;color:var(--pri);border-radius:12px;padding:8px 10px;font-weight:800;text-align:center;min-width:64px;font-size:13px}
.past{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;box-shadow:0 -4px 18px rgba(0,0,0,.12);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.navs{display:flex;overflow-x:auto;flex:1;scrollbar-width:none}
.navs::-webkit-scrollbar{display:none}
.nb{background:none;border:0;min-width:66px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);cursor:pointer;font-weight:600}
.nb i{font-style:normal;font-size:20px}
.nb.on{color:var(--pri)}
.nb.on i{transform:translateY(-2px) scale(1.15)}
.nb.adm{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 55%,#000));color:#fff;border-radius:14px;margin:6px;min-width:62px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
.box{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.box h3{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.adhead{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}
.arow{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;margin-top:10px;box-shadow:0 2px 8px rgba(30,40,90,.06)}
.arow .in{flex:1;min-width:0}
.arow .in b{display:block}
.arow .in small{color:var(--mut);font-size:12px}
.acts{display:flex;gap:6px}
.ib{border:0;background:#eef2ff;border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer}
.ib.del{background:#fee2e2}
.pa{display:flex;gap:6px}
.pb{width:44px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:var(--mut)}
.pb.on.p{background:var(--ok);color:#fff;border-color:var(--ok)}
.pb.on.a{background:var(--bad);color:#fff;border-color:var(--bad)}
.pv{width:80px;height:80px;border-radius:16px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;margin-bottom:6px}
.pv img{width:100%;height:100%;object-fit:cover}
.cb{display:flex;flex-wrap:wrap;gap:8px}
.cb label{display:flex;gap:6px;align-items:center;margin:0;background:#f5f6fc;padding:6px 10px;border-radius:10px;color:var(--txt);font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.logoedit{display:flex;gap:14px;align-items:center}
.ab p{margin-top:8px;line-height:1.6}
@media(min-width:700px){body{padding-bottom:90px}.ti h1{font-size:24px}}
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================= HELPERS ================= */
const KEY='oniisan_school_app_v1';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const el=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nl(s){return esc(s).replace(/\n/g,'<br>');}
function fmt(d){if(!d)return'';const p=d.split('-').map(Number);return p[2]+' '+MON[p[1]-1]+' '+p[0];}
function dayName(d){const p=d.split('-').map(Number);return DAYS[new Date(p[0],p[1]-1,p[2]).getDay()];}
let toastT;
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400);}
function showModal(h){const m=el('modal');m.innerHTML='<div class="box" onclick="event.stopPropagation()">'+h+'</div>';m.classList.add('on');m.onclick=closeModal;}
function closeModal(){el('modal').classList.remove('on');el('modal').innerHTML='';}
function avatar(p,n,s){s=s||44;return p?`<img class="av" style="width:${s}px;height:${s}px" src="${p}" alt="">`:`<div class="av ph" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.42)}px">${esc((n||'?').trim().charAt(0).toUpperCase())}</div>`;}
function readImg(file,max,type){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=im.width,h=im.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h);}x.drawImage(im,0,0,w,h);res(c.toDataURL(type,0.82));};im.src=r.result;};r.readAsDataURL(file);});}

/* ================= DATA ================= */
function defaults(){
  const names=['Nursery','LKG','UKG','1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th'];
  const classes=names.map((n,i)=>({id:'c'+i,name:n,manual:0}));
  const c9='c11';
  const stu=[['Aman Kumar',1,'Rajesh Kumar'],['Priya Kumari',2,'Sunil Prasad'],['Rohit Raj',3,'Manoj Singh'],['Sneha Sharma',4,'Anil Sharma'],['Vikash Yadav',5,'Ramesh Yadav'],['Pooja Kumari',6,'Dinesh Mahto']];
  const students=stu.map((x,i)=>({id:'s'+i,name:x[0],roll:x[1],father:x[2],phone:'',address:'',photo:'',classId:c9}));
  const att={};att[today()]={s0:'P',s1:'P',s2:'A',s3:'P',s4:'A',s5:'P'};
  return{
    school:{
      name:'Oniisan International School',
      tagline:'English Medium School',
      logo:'',
      color:'#4f46e5',
      session:'2026-27',
      principal:'',
      phone:'9341509571',
      principalPhone:'9341509572',
      email:'',
      address:'BLOCK CAMPUS, NEAR MAI ASTHAN, SAHEBGANJ (MUZ.), BIHAR-843125',
      about:'Welcome to Oniisan International School, an English medium school. We are committed to quality education, discipline and the all-round development of every child. (Edit this text from the Admin Panel.)',
      pass:'Rishabh@234'
    },
    classes,students,
    teachers:[
      {id:'t0',name:'Sunita Kumari',photo:'',subject:'English',classes:['c10','c11'],classTeacherOf:'c11',phone:'',address:'Sahebganj'},
      {id:'t1',name:'Rakesh Singh',photo:'',subject:'Maths',classes:['c10','c11','c12'],classTeacherOf:'c12',phone:'',address:'Sahebganj'}
    ],
    attendance:att,
    dcr:[{id:'d0',date:today(),classId:c9,subject:'Maths',classwork:'Chapter 3 - Polynomials was taught in class.',homework:'Complete Exercise 3.1, questions 1 to 5.'}],
    toppers:[{id:'p0',name:'Priya Kumari',classId:c9,rank:'1',percent:'92%',year:'2025-26',photo:''}],
    notices:[{id:'n0',date:today(),title:'Welcome!',text:'Welcome to the Oniisan International School app. All new notices will appear here.'}],
    holidays:[{id:'h0',date:'2026-12-25',to:'',title:'Christmas'},{id:'h1',date:'2027-01-26',to:'',title:'Republic Day'}]
  };
}
let DB;
function fixDB(){const d=defaults();for(const k in d){if(DB[k]===undefined)DB[k]=d[k];}for(const k in d.school){if(DB.school[k]===undefined)DB.school[k]=d.school[k];}}
function load(){try{const r=localStorage.getItem(KEY);DB=r?JSON.parse(r):defaults();}catch(e){DB=defaults();}fixDB();}
let warned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){if(!warned){warned=true;toast('Data could not be saved (storage full or blocked). Please take a backup!');}}}
function isAdm(){try{return sessionStorage.getItem('oniisan_adm')==='1';}catch(e){return false;}}
function setAdm(v){try{v?sessionStorage.setItem('oniisan_adm','1'):sessionStorage.removeItem('oniisan_adm');}catch(e){}}

load();
const S={page:'home',admin:isAdm(),aTab:'settings',cls:'',date:today(),aCls:'',aDate:today(),dcrCls:'',dcrDate:'',topCls:'',aStuCls:''};
function defCls(){const c=DB.classes.find(c=>DB.students.some(s=>s.classId===c.id))||DB.classes[0];return c?c.id:'';}
function curCls(k){if(!DB.classes.some(c=>c.id===S[k]))S[k]=defCls();return S[k];}

/* ================= UTIL QUERIES ================= */
const cn=id=>{const c=DB.classes.find(c=>c.id===id);return c?c.name:'';};
const ci=id=>DB.classes.findIndex(c=>c.id===id);
const byRoll=(a,b)=>((Number(a.roll)||9999)-(Number(b.roll)||9999))||String(a.name).localeCompare(b.name);
const classTeacher=id=>DB.teachers.find(t=>t.classTeacherOf===id);
function strength(c){const n=DB.students.filter(s=>s.classId===c.id).length;return n||Number(c.manual)||0;}
function holidayOn(d){return DB.holidays.find(h=>h.date<=d&&d<=(h.to||h.date));}
function stats(date,cid){const list=DB.students.filter(s=>!cid||s.classId===cid);const a=DB.attendance[date]||{};let p=0,b=0;list.forEach(s=>{if(a[s.id]==='P')p++;else if(a[s.id]==='A')b++;});return{total:list.length,p:p,a:b,n:list.length-p-b};}
function clsOpts(sel,all){return(all?`<option value="">${all}</option>`:'')+DB.classes.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y);}

/* ================= LAYOUT ================= */
const NAV=[['home','🏠','Home'],['classes','🏫','Classes'],['att','✅','Attendance'],['dcr','📚','Homework'],['top','🏆','Toppers'],['tch','👩‍🏫','Teachers'],['notice','📢','Notices'],['hol','🎉','Holidays'],['about','ℹ️','About']];
function go(p){if(p==='admin'&&!S.admin){loginModal();return;}S.page=p;render();window.scrollTo(0,0);}
function applyTheme(){const s=DB.school;document.documentElement.style.setProperty('--pri',s.color||'#4f46e5');document.title=s.name;if(s.logo){let l=el('fav');if(!l){l=document.createElement('link');l.id='fav';l.rel='icon';document.head.appendChild(l);}l.href=s.logo;}}
function renderTop(){const s=DB.school;el('top').innerHTML=`<div class="logo">${s.logo?`<img src="${s.logo}" alt="">`:'🏫'}</div><div class="ti"><h1>${esc(s.name)}</h1><p>${esc(s.tagline)}</p></div><div class="dt"><b>${DAYS[new Date().getDay()]}</b><br>${fmt(today())}</div>`;}
function renderNav(){el('nav').innerHTML='<div class="navs">'+NAV.map(n=>`<button class="nb ${S.page===n[0]?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('')+'</div>'+`<button class="nb adm ${S.page==='admin'?'on':''}" onclick="go('admin')"><i>⚙️</i>Admin</button>`;}
function render(){applyTheme();renderTop();renderNav();const fn=PAGES[S.page]||PAGES.home;el('view').innerHTML=fn();}

/* ================= PUBLIC PAGES ================= */
const PAGES={};
function studentRow(s){return`<div class="srow">${avatar(s.photo,s.name,42)}<div class="sn"><b>${esc(s.name)}</b><small>Roll ${esc(s.roll||'-')}${s.father?' • '+esc(s.father):''}</small></div></div>`;}

PAGES.home=()=>{
  const t=today(),h=holidayOn(t),sun=new Date().getDay()===0,st=stats(t);
  const total=DB.classes.reduce((a,c)=>a+strength(c),0);
  const notices=[...DB.notices].sort((a,b)=>b.date.localeCompare(a.date));
  const ups=DB.holidays.filter(x=>(x.to||x.date)>=t).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
  let ban;
  if(h)ban=`<div class="banner hol">🎉 Holiday today: ${esc(h.title)}</div>`;
  else if(sun)ban=`<div class="banner hol">🌴 Today is Sunday - School closed</div>`;
  else ban=`<div class="banner open">📅 School is open today</div>`;
  const rows=DB.classes.filter(c=>DB.students.some(s=>s.classId===c.id)).map(c=>{const x=stats(t,c.id);const mk=x.p+x.a>0;return`<tr class="link" onclick="goAtt('${c.id}')"><td>${esc(c.name)}</td><td>${x.total}</td><td style="color:var(--ok);font-weight:700">${mk?x.p:'-'}</td><td style="color:var(--bad);font-weight:700">${mk?x.a:'-'}</td></tr>`;}).join('');
  return`${ban}
  ${notices.length?`<div class="tick"><span>📢 ${notices.slice(0,5).map(n=>esc(n.title)).join(' &nbsp;•&nbsp; ')}</span></div>`:''}
  <div class="stats">
   <div class="st"><b>${total}</b><span>Total Students</span></div>
   <div class="st"><b>${DB.teachers.length}</b><span>Teachers</span></div>
   <div class="st"><b>${DB.classes.length}</b><span>Classes</span></div>
   <div class="st ok"><b>${st.p}</b><span>Present Today</span></div>
   <div class="st bad"><b>${st.a}</b><span>Absent Today</span></div>
  </div>
  <h2 class="sec">📊 Today's Attendance <small>(tap a class to see names)</small></h2>
  <div class="card">${rows?`<table><tr><th>Class</th><th>Total</th><th>Present</th><th>Absent</th></tr>${rows}</table>`:'<p class="empty">No students added yet.</p>'}</div>
  <h2 class="sec">🎉 Upcoming Holidays</h2>
  <div class="card">${ups.length?ups.map(holRow).join(''):'<p class="empty">No upcoming holidays.</p>'}</div>
  <h2 class="sec">📢 Latest Notices</h2>
  ${notices.slice(0,3).map(noticeCard).join('')||'<div class="card empty">No notices yet.</div>'}`;
};
function goAtt(id){S.cls=id;S.date=today();go('att');}

PAGES.classes=()=>`<h2 class="sec">🏫 All Classes <small>(Nursery to 10th)</small></h2><div class="grid">`+DB.classes.map(c=>{const ct=classTeacher(c.id);const x=stats(today(),c.id);const mk=x.p+x.a>0;return`<div class="card cc" onclick="openClass('${c.id}')"><h3>${esc(c.name)}</h3><div class="n">${strength(c)} <small style="font-size:12px;font-weight:400;display:inline">students</small></div><small>👩‍🏫 ${ct?esc(ct.name):'Class teacher not set'}</small>${mk?`<small>Today: ✅ ${x.p} &nbsp; ❌ ${x.a}</small>`:''}</div>`;}).join('')+`</div>`;
function openClass(id){const c=DB.classes.find(c=>c.id===id);if(!c)return;const l=DB.students.filter(s=>s.classId===id).sort(byRoll);const ct=classTeacher(id);showModal(`<h3>🏫 Class ${esc(c.name)}</h3><p style="color:var(--mut);font-size:13px">Total: ${strength(c)} • Class Teacher: ${ct?esc(ct.name):'-'}</p><div style="margin-top:8px">${l.length?l.map(studentRow).join(''):'<p class="empty">Student list has not been added yet.</p>'}</div><button class="btn out full" onclick="closeModal()">Close</button>`);}

PAGES.att=()=>{
  const cid=curCls('cls');const list=DB.students.filter(s=>s.classId===cid).sort(byRoll);
  const att=DB.attendance[S.date]||{};
  const P=list.filter(s=>att[s.id]==='P'),A=list.filter(s=>att[s.id]==='A'),N=list.filter(s=>!att[s.id]);
  const hol=holidayOn(S.date);
  const grp=(t,arr,c)=>arr.length?`<div class="card"><div class="gt ${c}">${t} (${arr.length})</div>${arr.map(studentRow).join('')}</div>`:'';
  let body;
  if(!list.length)body='<div class="card empty">There are no students in this class yet.</div>';
  else if(!P.length&&!A.length)body='<div class="card empty">Attendance has not been taken for this date.</div>';
  else body=grp('❌ Absent',A,'bad')+grp('✅ Present',P,'ok')+grp('⏳ Not marked',N,'mut');
  return`<h2 class="sec">✅ Attendance</h2>
  <div class="card"><div class="row2"><div><label>Class</label><select onchange="S.cls=this.value;render()">${clsOpts(cid)}</select></div><div><label>Date (${dayName(S.date)})</label><input type="date" value="${S.date}" onchange="S.date=this.value||today();render()"></div></div>
  ${hol?`<div class="alert">🎉 Holiday: ${esc(hol.title)}</div>`:''}
  <div class="chips3"><div class="sc"><b>${list.length}</b>Total</div><div class="sc ok"><b>${P.length}</b>Present</div><div class="sc bad"><b>${A.length}</b>Absent</div></div></div>${body}`;
};

PAGES.dcr=()=>{
  let L=[...DB.dcr];if(S.dcrCls)L=L.filter(x=>x.classId===S.dcrCls);if(S.dcrDate)L=L.filter(x=>x.date===S.dcrDate);

  return`<h2 class="sec">📚 DCR / Homework <small>(Daily Class Report)</small></h2>
  <div class="card"><div class="row2"><div><label>Class</label><select onchange="S.dcrCls=this.value;render()">${clsOpts(S.dcrCls,'All Classes')}</select></div><div><label>Date</label><input type="date" value="${S.dcrDate}" onchange="S.dcrDate=this.value;render()"></div></div>
  <div class="btnrow"><button class="btn sm out" onclick="S.dcrDate=today();render()">Today</button><button class="btn sm out" onclick="S.dcrDate='';S.dcrCls='';render()">Show All</button></div></div>`+
  (L.length?L.map(d=>`<div class="card dc"><div class="dh"><span class="badge">${esc(cn(d.classId)||'-')}</span><b>${esc(d.subject||'')}</b><small>${fmt(d.date)}</small></div>${d.classwork?`<p><b>📖 Classwork:</b><br>${nl(d.classwork)}</p>`:''}${d.homework?`<p><b>✏️ Homework:</b><br>${nl(d.homework)}</p>`:''}</div>`).join(''):'<div class="card empty">No DCR / homework found.</div>');

PAGES.top=()=>{
  let L=[...DB.toppers];if(S.topCls)L=L.filter(x=>x.classId===S.topCls);
  L.sort((a,b)=>ci(a.classId)-ci(b.classId)||(Number(a.rank)||99)-(Number(b.rank)||99));
  const medal=r=>({1:'🥇',2:'🥈',3:'🥉'}[Number(r)]||'🏅');
  return`<h2 class="sec">🏆 Toppers</h2><div class="card"><label style="margin-top:0">Class</label><select onchange="S.topCls=this.value;render()">${clsOpts(S.topCls,'All Classes')}</select></div>`+
  (L.length?L.map(t=>`<div class="card tp">${avatar(t.photo,t.name,64)}<div style="flex:1"><b style="font-size:16px">${esc(t.name)}</b><div style="margin-top:4px"><span class="badge">Class ${esc(cn(t.classId))}</span> ${t.year?`<span class="badge g">${esc(t.year)}</span>`:''}</div>${t.percent?`<div style="margin-top:4px;color:var(--mut);font-size:13px">Marks: <b>${esc(t.percent)}</b></div>`:''}</div><div class="rk">${medal(t.rank)}<div style="font-size:11px;text-align:center;color:var(--mut)">${t.rank?'Rank '+esc(t.rank):''}</div></div></div>`).join(''):'<div class="card empty">No toppers added yet.</div>');

function tCard(t){const ct=t.classTeacherOf?cn(t.classTeacherOf):'';const cl=(t.classes||[]).map(cn).filter(Boolean).join(', ');return`<div class="card tc">${avatar(t.photo,t.name,72)}<div style="flex:1;min-width:0"><h4>${esc(t.name)}</h4>${ct?`<span class="badge g">Class Teacher: ${esc(ct)}</span>`:''}<p>📘 Subject: <b>${esc(t.subject||'-')}</b></p><p>🏫 Teaches: ${esc(cl||'-')}</p><p>📍 ${esc(t.address||'-')}</p>${t.phone?`<p>📞 <a href="tel:${esc(t.phone)}">${esc(t.phone)}</a></p>`:''}</div></div>`;}
PAGES.tch=()=>{const cts=DB.teachers.filter(t=>t.classTeacherOf).sort((a,b)=>ci(a.classTeacherOf)-ci(b.classTeacherOf));return`<h2 class="sec">⭐ Class Teachers</h2>${cts.map(tCard).join('')||'<div class="card empty">No class teacher assigned yet.</div>'}<h2 class="sec">👩‍🏫 All Teachers</h2>${DB.teachers.map(tCard).join('')||'<div class="card empty">No teachers added yet.</div>'}`;};

function noticeCard(n){return`<div class="card"><div class="dh"><b>📢 ${esc(n.title)}</b><small>${fmt(n.date)}</small></div><p style="line-height:1.5">${nl(n.text)}</p></div>`;}
PAGES.notice=()=>{const L=[...DB.notices].sort((a,b)=>b.date.localeCompare(a.date));return`<h2 class="sec">📢 Notice Board</h2>`+(L.map(noticeCard).join('')||'<div class="card empty">No notices yet.</div>');};

function holRow(h){const t=today(),end=h.to||h.date;const range=fmt(h.date)+(h.to&&h.to!==h.date?' → '+fmt(h.to):'');const p=h.date.split('-');return`<div class="hrow ${end<t?'past':''}" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="d">${Number(p[2])}<br>${MON[Number(p[1])-1]}</div><div><b>${esc(h.title)}</b><div style="font-size:12px;color:var(--mut)">${range} • ${dayName(h.date)}</div></div></div>`;}

/* ================= ADMIN: SCHEMA & CRUD ================= */
const SCHEMA={
  classes:{title:'Class',fields:[{k:'name',l:'Class name (e.g. 9th)',t:'text',req:1},{k:'manual',l:'Total students (manual) - use only if you are not adding a student list',t:'number'}]},
  students:{title:'Student',fields:[{k:'name',l:'Name',t:'text',req:1},{k:'classId',l:'Class',t:'class',req:1},{k:'roll',l:'Roll No.',t:'number'},{k:'father',l:"Father's name",t:'text'},{k:'phone',l:'Phone',t:'tel'},{k:'address',l:'Address',t:'text'},{k:'photo',l:'Photo',t:'photo'}]},
  teachers:{title:'Teacher',fields:[{k:'name',l:'Name',t:'text',req:1},{k:'photo',l:'Photo',t:'photo'},{k:'subject',l:'Subject',t:'text'},{k:'classes',l:'Classes taught',t:'classes'},{k:'classTeacherOf',l:'Class Teacher of (optional)',t:'classopt'},{k:'phone',l:'Phone',t:'tel'},{k:'address',l:'Address',t:'text'}]},
  dcr:{title:'DCR / Homework',fields:[{k:'date',l:'Date',t:'date',req:1},{k:'classId',l:'Class',t:'class',req:1},{k:'subject',l:'Subject',t:'text',req:1},{k:'classwork',l:'Classwork (what was taught)',t:'textarea'},{k:'homework',l:'Homework',t:'textarea'}]},
  toppers:{title:'Topper',fields:[{k:'name',l:'Name',t:'text',req:1},{k:'classId',l:'Class',t:'class',req:1},{k:'rank',l:'Rank (1, 2, 3...)',t:'number'},{k:'percent',l:'Marks / Percentage',t:'text'},{k:'year',l:'Session (e.g. 2025-26)',t:'text'},{k:'photo',l:'Photo',t:'photo'}]},
  notices:{title:'Notice',fields:[{k:'date',l:'Date',t:'date',req:1},{k:'title',l:'Title',t:'text',req:1},{k:'text',l:'Notice details',t:'textarea'}]},
  holidays:{title:'Holiday',fields:[{k:'date',l:'From date',t:'date',req:1},{k:'to',l:'To date (leave empty for a single day)',t:'date'},{k:'title',l:'Reason / Occasion',t:'text',req:1}]}
};
let FORM={};
function openForm(coll,id){
  const sc=SCHEMA[coll];const item=id?(DB[coll].find(x=>x.id===id)||{}):{};
  FORM={coll:coll,id:id||null,photos:{}};
  let h=`<h3>${id?'✏️ Edit':'➕ Add'} ${sc.title}</h3><form onsubmit="return saveForm(event)">`;
  sc.fields.forEach(f=>{
    let v=item[f.k];if(v===undefined)v=(f.t==='date'&&f.k==='date')?today():(f.t==='classes'?[]:'');
    if(f.t==='class'&&!v&&!id)v=(f.k==='classId'&&coll==='students'&&S.aStuCls)?S.aStuCls:'';
    h+=`<label>${f.l}${f.req?' *':''}</label>`;
    if(f.t==='textarea')h+=`<textarea name="${f.k}">${esc(v)}</textarea>`;
    else if(f.t==='class')h+=`<select name="${f.k}"><option value="">-- Select class --</option>${clsOpts(v)}</select>`;
    else if(f.t==='classopt')h+=`<select name="${f.k}"><option value="">None</option>${clsOpts(v)}</select>`;
    else if(f.t==='classes')h+=`<div class="cb">${DB.classes.map(c=>`<label><input type="checkbox" name="${f.k}" value="${c.id}" ${(v||[]).includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')}</div>`;
    else if(f.t==='photo')h+=`<div class="pv" id="pv_${f.k}">${v?`<img src="${v}" alt="">`:'📷'}</div><input type="file" accept="image/*" onchange="pickPhoto('${f.k}',this)">`;
    else h+=`<input type="${f.t}" name="${f.k}" value="${esc(v)}">`;
  });
  h+=`<button class="btn full">💾 Save</button></form><button class="btn out full" onclick="closeModal()">Cancel</button>`;
  showModal(h);
}
async function pickPhoto(k,inp){const f=inp.files[0];if(!f)return;try{const d=await readImg(f,320,'image/jpeg');FORM.photos[k]=d;el('pv_'+k).innerHTML=`<img src="${d}" alt="">`;}catch(e){toast('Could not load the photo');}}
function saveForm(e){
  e.preventDefault();
  const coll=FORM.coll,id=FORM.id,sc=SCHEMA[coll],f=e.target,vals={};
  for(const fl of sc.fields){
    if(fl.t==='photo'){const old=id?((DB[coll].find(x=>x.id===id)||{})[fl.k]||''):'';vals[fl.k]=FORM.photos[fl.k]!==undefined?FORM.photos[fl.k]:old;}
    else if(fl.t==='classes'){vals[fl.k]=[...f.querySelectorAll(`input[name="${fl.k}"]:checked`)].map(x=>x.value);}
    else vals[fl.k]=f.elements[fl.k].value.trim();
    if(fl.req&&!vals[fl.k]){toast(fl.l+' is required');return false;}
  }
  if(coll==='classes')vals.manual=Math.max(0,parseInt(vals.manual)||0);
  if(coll==='holidays'&&vals.to&&vals.to<vals.date){toast('"To date" cannot be before "From date"');return false;}
  let item;
  if(id){item=DB[coll].find(x=>x.id===id);Object.assign(item,vals);}
  else{item=Object.assign({id:uid()},vals);DB[coll].push(item);}
  if(coll==='teachers'&&item.classTeacherOf){DB.teachers.forEach(t=>{if(t.id!==item.id&&t.classTeacherOf===item.classTeacherOf)t.classTeacherOf='';});}
  save();closeModal();rerender();toast('Saved ✅');return false;
}
function del(coll,id){
  const item=DB[coll].find(x=>x.id===id);if(!item)return;
  if(coll==='classes'&&DB.students.some(s=>s.classId===id)){alert('This class has students. Please remove them or move them to another class first.');return;}
  if(!confirm('Are you sure you want to delete this?'))return;
  DB[coll]=DB[coll].filter(x=>x.id!==id);
  if(coll==='classes'){DB.teachers.forEach(t=>{t.classes=(t.classes||[]).filter(c=>c!==id);if(t.classTeacherOf===id)t.classTeacherOf='';});DB.dcr=DB.dcr.filter(d=>d.classId!==id);DB.toppers=DB.toppers.filter(d=>d.classId!==id);}
  if(coll==='students'){for(const d in DB.attendance){delete DB.attendance[d][id];}}
  save();rerender();toast('Deleted');
}
function adminList(coll,rowFn,items){
  items=items||DB[coll];
  return`<button class="btn" onclick="openForm('${coll}')">➕ Add New</button><div>`+(items.length?items.map(it=>`<div class="arow">${rowFn(it)}<div class="acts"><button class="ib" onclick="openForm('${coll}','${it.id}')">✏️</button><button class="ib del" onclick="del('${coll}','${it.id}')">🗑️</button></div></div>`).join(''):'<p class="empty">Nothing added yet</p>')+'</div>';
}

function saveSettings(){

ADMIN.att=()=>{
  const cid=curCls('aCls');const list=DB.students.filter(s=>s.classId===cid).sort(byRoll);
  const att=DB.attendance[S.aDate]||{};
  const p=list.filter(s=>att[s.id]==='P').length,a=list.filter(s=>att[s.id]==='A').length;
  return`<div class="card"><div class="row2"><div><label style="margin-top:0">Class</label><select onchange="S.aCls=this.value;render()">${clsOpts(cid)}</select></div><div><label style="margin-top:0">Date (${dayName(S.aDate)})</label><input type="date" value="${S.aDate}" onchange="S.aDate=this.value||today();render()"></div></div>
  <div class="chips3"><div class="sc"><b>${list.length}</b>Total</div><div class="sc ok"><b>${p}</b>Present</div><div class="sc bad"><b>${a}</b>Absent</div></div>
  <div class="btnrow"><button class="btn sm" onclick="markAll('P')">All Present</button><button class="btn sm red" onclick="markAll('A')">All Absent</button><button class="btn sm out" onclick="markAll('')">Clear</button></div></div>`+
  (list.length?list.map(s=>{const st=att[s.id];return`<div class="arow">${avatar(s.photo,s.name,40)}<div class="in"><b>${esc(s.name)}</b><small>Roll ${esc(s.roll||'-')}</small></div><div class="pa"><button class="pb ${st==='P'?'on p':''}" onclick="setAtt('${s.id}','P')">P</button><button class="pb ${st==='A'?'on a':''}" onclick="setAtt('${s.id}','A')">A</button></div></div>`;}).join(''):'<div class="card empty">There are no students in this class. Please add them in the Students tab first.</div>')+
  `<p style="color:var(--mut);font-size:12px;margin-top:10px;text-align:center">P = Present, A = Absent. Tap again to clear. Saves automatically.</p>`;
};
function setAtt(id,v){const d=S.aDate;DB.attendance[d]=DB.attendance[d]||{};if(DB.attendance[d][id]===v)delete DB.attendance[d][id];else DB.attendance[d][id]=v;if(!Object.keys(DB.attendance[d]).length)delete DB.attendance[d];save();rerender();}
function markAll(v){const d=S.aDate,cid=curCls('aCls');DB.attendance[d]=DB.attendance[d]||{};DB.students.filter(s=>s.classId===cid).forEach(s=>{if(v)DB.attendance[d][s.id]=v;else delete DB.attendance[d][s.id];});if(!Object.keys(DB.attendance[d]).length)delete DB.attendance[d];save();rerender();}

ADMIN.dcr=()=>adminList('dcr',d=>`<div class="in"><b>${esc(d.subject)} • ${esc(cn(d.classId))}</b><small>${fmt(d.date)} - ${esc((d.homework||d.classwork||'').slice(0,50))}</small></div>`,[...DB.dcr].sort((a,b)=>b.date.localeCompare(a.date)));
ADMIN.toppers=()=>adminList('toppers',t=>`${avatar(t.photo,t.name,42)}<div class="in"><b>${esc(t.name)}</b><small>Class ${esc(cn(t.classId))} • Rank ${esc(t.rank||'-')} • ${esc(t.percent||'')}</small></div>`);
ADMIN.notices=()=>adminList('notices',n=>`<div class="in"><b>${esc(n.title)}</b><small>${fmt(n.date)}</small></div>`,[...DB.notices].sort((a,b)=>b.date.localeCompare(a.date)));
ADMIN.holidays=()=>adminList('holidays',h=>`<div class="in"><b>${esc(h.title)}</b><small>${fmt(h.date)}${h.to&&h.to!==h.date?' → '+fmt(h.to):''}</small></div>`,[...DB.holidays].sort((a,b)=>a.date.localeCompare(b.date)));

ADMIN.backup=()=>`<div class="card"><h3>💾 Backup & Restore</h3><p style="color:var(--mut);margin:8px 0;font-size:13px;line-height:1.5">Data is saved in this browser. To keep it safe, download a backup from time to time. You can import the same backup on another phone or computer.</p>
<div class="btnrow"><button class="btn" onclick="exportData()">⬇️ Download Backup</button><input type="file" id="impF" accept=".json,application/json" hidden onchange="importData(this)"><button class="btn out" onclick="el('impF').click()">⬆️ Import Backup</button></div></div>
<div class="card"><h3>⚠️ Reset Everything</h3><p style="color:var(--mut);margin:8px 0;font-size:13px">All data will be erased and the app will return to its starting state.</p><button class="btn red" onclick="resetAll()">Reset All Data</button></div>`;
function exportData(){const b=new Blob([JSON.stringify(DB)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oniisan-school-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.school||!Array.isArray(d.classes))throw new Error('bad');if(!confirm('Current data will be replaced. Continue?'))return;DB=d;fixDB();save();S.cls=S.aCls=defCls();render();toast('Backup imported ✅');}catch(e){toast('Invalid backup file');}};r.readAsText(f);inp.value='';}
function resetAll(){if(!confirm('Are you sure? All data will be deleted!'))return;if(!confirm('Please confirm once more - reset everything?'))return;DB=defaults();save();S.cls=S.aCls=defCls();render();toast('Reset complete');}

/* ================= START ================= */
S.cls=S.aCls=defCls();
render();
</script>
</body>
</html>
